name: Release

# Publishes provider-guard to npm, with provenance, when packages/core/package.json carries a
# version that is not on npm yet. Versions come from changesets, applied locally:
#
#   pnpm changeset          # describe the change
#   pnpm changeset version  # bump the version and write CHANGELOG.md; commit and push
#
# Publishing needs an NPM_TOKEN repository secret. Without it, the run succeeds and says that
# publishing was skipped; add the secret, then re-run this workflow (or push again).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Decide whether to publish
        id: decide
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "provider-guard@$version" version > /dev/null 2>&1; then
            echo "provider-guard@$version is already on npm. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NPM_TOKEN" ]; then
            echo "::notice title=Publishing skipped::provider-guard@$version is not on npm yet, and the NPM_TOKEN secret is not set. Add the secret, then re-run this workflow."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.decide.outputs.publish == 'true'
        run: pnpm build
      - name: Publish provider-guard@${{ steps.decide.outputs.version }}
        if: steps.decide.outputs.publish == 'true'
        run: pnpm --filter provider-guard publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
